[project]
name = "nyaapy-ncurses"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Faez Akhtar", email = "faezakhtar110@outlook.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4==4.12.2",
    "bs4==0.0.1",
    "certifi==2023.5.7",
    "charset-normalizer==3.1.0",
    "idna==3.4",
    "lxml>=5.0.0",
    "markdown-it-py==2.2.0",
    "mdurl==0.1.2",
    "pygments==2.15.1",
    "pyperclip==1.11.0",
    "requests==2.30.0",
    "rich==13.3.5",
    "soupsieve==2.4.1",
    "transmission-rpc==7.0.11",
    "typing-extensions==4.15.0",
    "urllib3==2.0.2",
]

[project.scripts]
nyaapy-ncurses = "nyaapy_ncurses:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
